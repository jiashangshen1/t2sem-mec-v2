# Scale-up + Semantic MAPPO baseline: closes the scale-up deployment triangle.
# Combines the scale-up topology (2x UEs/terminals, +2 UAVs, larger area) with
# decentralized per-terminal PPO actors (independent_ppo) under the same feasibility mask F.
num_users: 16
terminals_per_user: 2
area_size: 700.0

uav:
  init_positions:
    - [100.0, 100.0, 100.0]
    - [250.0, 250.0, 100.0]
    - [400.0, 400.0, 100.0]
    - [175.0, 525.0, 100.0]
    - [525.0, 175.0, 100.0]

hap:
  positions:
    - [200.0, 500.0, 20000.0]
    - [500.0, 200.0, 20000.0]

num_uavs: 5

reward:
  w_throughput: 5.0
  w_energy: 0.01
  w_sla: 1.0
  w_queue: 0.2
  w_traj_energy: 0.6
  w_fairness: 0.1
  rho_delay: 3.0
  rho_sem: 3.0
  penalty_clip: 5.0
  energy_reward_clip: 100.0
  shaping_enabled: true
  w_shaping: 1.0
  lagrangian_enabled: true
  per_tier_lambda: true
  sla_target_by_tier:
    critical: 0.70
    interactive: 0.85
    best_effort: 0.85
  sla_target: 0.8
  sla_lambda_init: 2.0
  lambda_lr: 0.1
  lambda_min: 0.0
  lambda_max: 8.0
  lambda_ema: 0.3
  lambda_deficit_clip: 0.2
  feasibility_mask_enabled: true
  mask_delay_margin: 0.8
  mask_delay_margin_by_tier:
    critical: 0.75
    interactive: 0.65
    best_effort: 0.85
  mask_sim_margin: 0.05
  mask_channel: expected

drl:
  short:
    algo: independent_ppo
    lr: 3.0e-4
    update_epochs: 10
    entropy_coef: 0.01
    init_log_std: -0.3
    log_std_min: -2.0
    log_std_max: 0.7
    max_grad_norm: 0.5
  long:
    noise_std: 0.08
    action_l2_coef: 0.05
    smooth_coef: 0.02
  total_long_frames: 300
  bc_source: filtered
  bc_demo_episodes: 30
  bc_train_epochs: 150
  bc_min_samples: 200

experiment:
  eval_episodes: 30
  eval_seeds: [42, 123, 456]
  checkpoint_dir: results/checkpoints_scaleup_semantic
  log_dir: results/logs_scaleup_semantic
  results_dir: results/scaleup_semantic
  checkpoint_metric: eval
  ckpt_eval_every: 15
  ckpt_eval_episodes: 3
